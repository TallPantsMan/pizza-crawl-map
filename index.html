<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🍕 Pizza Crawl Map (2015–2026)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      border: 2.5px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
      transition: transform 0.15s ease;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      padding: 2px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .leaflet-popup-content {
      margin: 10px 12px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-full w-full overflow-hidden">
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2.5 md:px-5 md:py-3 shrink-0 z-30">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-lg shrink-0">🍕</div>
        <div class="min-w-0">
          <h1 class="text-sm md:text-lg font-bold tracking-tight text-white truncate">Pizza Crawl Map (2015–2026)</h1>
          <p class="text-[11px] md:text-xs text-slate-400 truncate">52 Pizzerias • 12 Annual Crawls • NYC, Westchester &amp; CT</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button id="shareBtn" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold text-xs px-2.5 py-2 rounded-lg flex items-center gap-1 shadow transition" title="Send to a friend">
          <span>📲</span><span>Share</span>
        </button>
        <button id="locateBtn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center gap-1 shadow transition" title="Show my location">
          <span>📍</span><span class="hidden sm:inline">Near Me</span>
        </button>
        <button id="mobileToggleBtn" class="md:hidden bg-slate-800 border border-slate-700 text-amber-400 font-semibold text-xs px-3 py-2 rounded-lg flex items-center gap-1">
          <span id="mobileToggleIcon">🏆</span>
          <span id="mobileToggleText">List (52)</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-1.5 mt-2">
      <select id="crawlFilter" class="bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-lg px-2.5 py-2 focus:outline-none focus:border-amber-500 w-full sm:w-auto">
        <option value="ALL">All 12 Crawls (2015–2026)</option>
        <option value="2026">2026 — Crawl XII (BK/MHTN)</option>
        <option value="2025">2025 — Crawl XI (Westchester)</option>
        <option value="2024">2024 — Crawl X (G.O.A.T.)</option>
        <option value="2023">2023 — Crawl IX (Manhattan)</option>
        <option value="2022">2022 — Crawl VIII (Staten Island)</option>
        <option value="2021">2021 — Crawl VII (Brooklyn)</option>
        <option value="2020">2020 — Crawl VI (New Haven)</option>
        <option value="2019">2019 — Crawl V (Bronx)</option>
        <option value="2018">2018 — Crawl IV (Fire &amp; Slice)</option>
        <option value="2017">2017 — Crawl III (Cheese in Heat)</option>
        <option value="2016">2016 — Crawl II (Brooklyn)</option>
        <option value="2015">2015 — Crawl I (Inaugural)</option>
      </select>

      <select id="regionFilter" class="bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-lg px-2.5 py-2 focus:outline-none focus:border-amber-500 w-full sm:w-auto">
        <option value="ALL">All Regions (52)</option>
        <option value="Manhattan">Manhattan (18)</option>
        <option value="Brooklyn">Brooklyn (14)</option>
        <option value="Staten Island">Staten Island (5)</option>
        <option value="Bronx">Bronx (5)</option>
        <option value="Westchester">Westchester (5)</option>
        <option value="New Haven, CT">New Haven, CT (5)</option>
      </select>

      <input id="searchInput" type="search" placeholder="Search pizzeria or neighborhood..." class="col-span-2 sm:w-52 bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500" />
    </div>
  </header>

  <div class="flex flex-1 relative overflow-hidden">
    <aside id="sidebarPanel" class="hidden md:flex flex-col w-full md:w-96 bg-slate-900 border-r border-slate-800 shrink-0 absolute md:static inset-0 z-20">
      <div class="p-2.5 px-3.5 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 bg-slate-900/95">
        <span id="countLabel" class="font-medium text-slate-300">Showing 52 pizzerias</span>
        <div class="flex items-center gap-2 text-[11px]">
          <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span> 4.0+</span>
          <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 3.6+</span>
          <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 3.2+</span>
          <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span> &lt;3.2</span>
        </div>
      </div>
      <div id="placesList" class="flex-1 overflow-y-auto divide-y divide-slate-800/70 pb-16 md:pb-0"></div>
    </aside>

    <main class="flex-1 relative h-full w-full">
      <div id="map" class="w-full h-full z-10"></div>
    </main>
  </div>

  <script>
    function bootApp() {
      if (typeof L === 'undefined') {
        setTimeout(bootApp, 50);
        return;
      }
      let PLACES = [];
      let mobileListOpen = false;
      let userLocationMarker = null;
      let currentFilteredCount = 52;

      const map = L.map('map', {
        center: [40.735, -73.965],
        zoom: 12,
        zoomControl: false
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0','mt1','mt2','mt3'],
        attribution: '&copy; Google Maps'
      }).addTo(map);

      const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0','mt1','mt2','mt3'],
        attribution: '&copy; Google Maps Satellite'
      });

      L.control.layers({
        "Google Maps": googleStreets,
        "Satellite": googleHybrid
      }, null, { position: 'topright' }).addTo(map);

      const markersLayer = L.layerGroup().addTo(map);

      function getTierColor(score) {
        if (score === null || score === undefined) return '#8b5cf6';
        if (score >= 4.0) return '#f59e0b';
        if (score >= 3.6) return '#10b981';
        if (score >= 3.2) return '#3b82f6';
        return '#f43f5e';
      }

      function toggleMobileView(forceMap) {
        const sidebar = document.getElementById('sidebarPanel');
        const icon = document.getElementById('mobileToggleIcon');
        const text = document.getElementById('mobileToggleText');
        if (forceMap === true) {
          mobileListOpen = false;
        } else {
          mobileListOpen = !mobileListOpen;
        }
        if (mobileListOpen) {
          sidebar.classList.remove('hidden');
          sidebar.classList.add('flex');
          icon.textContent = '🗺️';
          text.textContent = 'Map View';
        } else {
          sidebar.classList.add('hidden');
          sidebar.classList.remove('flex');
          icon.textContent = '🏆';
          text.textContent = `List (${currentFilteredCount})`;
          setTimeout(() => map.invalidateSize(), 50);
        }
      }

      function render() {
        const crawlVal = document.getElementById('crawlFilter').value;
        const regionVal = document.getElementById('regionFilter').value;
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        markersLayer.clearLayers();
        const listEl = document.getElementById('placesList');
        listEl.innerHTML = '';

        const filtered = PLACES.filter(p => {
          if (regionVal !== 'ALL' && p.region !== regionVal) return false;
          if (crawlVal !== 'ALL') {
            const yr = parseInt(crawlVal, 10);
            if (!p.appearances.some(a => a.year === yr)) return false;
          }
          if (query) {
            const hay = (p.name + ' ' + p.neighborhood + ' ' + p.region + ' ' + p.address + ' ' + p.notes).toLowerCase();
            if (!hay.includes(query)) return false;
          }
          return true;
        });

        filtered.sort((a, b) => {
          if (crawlVal !== 'ALL') {
            const yr = parseInt(crawlVal, 10);
            const appA = a.appearances.find(x => x.year === yr);
            const appB = b.appearances.find(x => x.year === yr);
            const rA = appA && appA.rank ? appA.rank : 999;
            const rB = appB && appB.rank ? appB.rank : 999;
            return rA - rB;
          }
          const rA = a.best_rank ? a.best_rank : 999;
          const rB = b.best_rank ? b.best_rank : 999;
          return rA - rB;
        });

        currentFilteredCount = filtered.length;
        document.getElementById('countLabel').textContent = `Showing ${filtered.length} pizzeria${filtered.length === 1 ? '' : 's'}`;
        if (!mobileListOpen) {
          document.getElementById('mobileToggleText').textContent = `List (${filtered.length})`;
        }

        const bounds = [];

        filtered.forEach(p => {
          let activeApp = p.appearances[0];
          if (crawlVal !== 'ALL') {
            const yr = parseInt(crawlVal, 10);
            activeApp = p.appearances.find(x => x.year === yr) || p.appearances[0];
          }
          const color = getTierColor(activeApp.score);

          const icon = L.divIcon({
            className: '',
            html: `<div class="custom-pin" style="background:${color};width:32px;height:32px;">${activeApp.rank ? activeApp.rank : '★'}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
          });

          const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' ' + p.address)}`;
          const appsHtml = p.appearances.map(a =>
            `<div class="text-xs py-1 flex items-center justify-between gap-2 border-b border-slate-100 last:border-0">
              <span class="text-slate-700 font-medium">${a.year} — ${a.crawl}</span>
              <span class="font-bold text-slate-900 whitespace-nowrap">${a.score !== null ? a.score.toFixed(3) + ' (#' + a.rank + ')' : 'Inaugural'}</span>
            </div>`
          ).join('');

          const popupHtml = `
            <div class="min-w-[240px] max-w-[280px] text-slate-900">
              <span class="inline-block text-xs font-bold px-2 py-0.5 rounded text-white mb-1" style="background:${color}">
                ${activeApp.rank ? 'Rank #' + activeApp.rank : '2015 Crawl'} • ${activeApp.score !== null ? activeApp.score.toFixed(3) : 'Unscored'}
              </span>
              <h3 class="font-bold text-base leading-snug">${p.name}</h3>
              <p class="text-xs text-slate-500">${p.neighborhood} • ${p.region}</p>
              <p class="text-xs text-slate-600 mt-1">${p.address}</p>
              <div class="mt-2 bg-slate-50 rounded-lg p-2 border border-slate-200">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Crawl History</div>
                ${appsHtml}
              </div>
              <p class="text-xs italic text-slate-500 mt-1.5">${p.notes}</p>
              <a href="${gmapsUrl}" target="_blank" rel="noopener" class="mt-2.5 block w-full text-center bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold text-xs py-2.5 rounded-lg shadow transition">
                Open in Google Maps App ↗
              </a>
            </div>
          `;

          const marker = L.marker([p.lat, p.lng], { icon }).bindPopup(popupHtml);
          markersLayer.addLayer(marker);
          bounds.push([p.lat, p.lng]);

          const item = document.createElement('div');
          item.className = 'p-3.5 hover:bg-slate-800/70 active:bg-slate-800 cursor-pointer transition flex items-start gap-3';
          item.innerHTML = `
            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs text-white shrink-0 mt-0.5" style="background:${color}">
              ${activeApp.rank ? '#' + activeApp.rank : '★'}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between gap-2">
                <h4 class="font-semibold text-sm text-white truncate">${p.name}</h4>
                <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-amber-400 border border-slate-700 shrink-0">
                  ${activeApp.score !== null ? activeApp.score.toFixed(3) : '2015'}
                </span>
              </div>
              <p class="text-xs text-slate-400 truncate mt-0.5">${p.neighborhood} (${p.region}) • ${p.address}</p>
            </div>
          `;
          item.addEventListener('click', () => {
            if (window.innerWidth < 768) {
              toggleMobileView(true);
            }
            setTimeout(() => {
              map.setView([p.lat, p.lng], 16, { animate: true });
              marker.openPopup();
            }, 80);
          });
          listEl.appendChild(item);
        });

        if (bounds.length > 0) {
          if (crawlVal === 'ALL' && regionVal === 'ALL' && !query) {
            map.setView([40.735, -73.965], 11);
          } else {
            map.fitBounds(bounds, { padding: [35, 35], maxZoom: 15 });
          }
        }
      }

      document.getElementById('mobileToggleBtn').addEventListener('click', () => toggleMobileView());
      document.getElementById('crawlFilter').addEventListener('change', render);
      document.getElementById('regionFilter').addEventListener('change', render);
      document.getElementById('searchInput').addEventListener('input', render);

      document.getElementById('locateBtn').addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser.');
          return;
        }
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          if (userLocationMarker) map.removeLayer(userLocationMarker);
          userLocationMarker = L.circleMarker([latitude, longitude], {
            radius: 9,
            fillColor: '#3b82f6',
            color: '#ffffff',
            weight: 3,
            fillOpacity: 1
          }).addTo(map).bindPopup('<b>You are here</b>').openPopup();
          map.setView([latitude, longitude], 14, { animate: true });
        }, () => {
          alert('Unable to retrieve your location. Make sure location permissions are enabled.');
        });
      });

      document.getElementById('shareBtn').addEventListener('click', async () => {
        const shareUrl = window.location.href;
        const shareData = {
          title: '🍕 Pizza Crawl Map (2015–2026)',
          text: 'Interactive map & rankings of all 52 Pizza Crawl pizzerias (2015–2026):',
          url: shareUrl
        };
        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {}
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          const btn = document.getElementById('shareBtn');
          const orig = btn.innerHTML;
          btn.innerHTML = '<span>✅</span><span>Copied!</span>';
          setTimeout(() => { btn.innerHTML = orig; }, 2000);
        } catch (e) {
          prompt('Copy this link to send to your friend:', shareUrl);
        }
      });

      fetch('https://raw.githubusercontent.com/TallPantsMan/pizza-crawl-map/main/places.json')
        .then(r => r.json())
        .then(data => {
          PLACES = data;
          render();
        });
    }
    bootApp();
  </script>
</body>
</html>
