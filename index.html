<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🍕 Pizza Crawl Map (2015–2026)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #020617; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-root {
      display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden;
    }
    .top-header {
      background: #0f172a; border-bottom: 1px solid #1e293b; padding: 10px 14px; flex-shrink: 0; z-index: 30;
    }
    .header-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .brand-box {
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .logo-badge {
      width: 36px; height: 36px; border-radius: 10px; background: rgba(245,158,11,0.18);
      border: 1px solid rgba(245,158,11,0.4); display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .brand-title {
      font-size: 15px; font-weight: 700; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 11px; color: #94a3b8; margin: 2px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .actions-row {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .btn {
      border: none; border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-share { background: #f59e0b; color: #090d16; }
    .btn-locate { background: #2563eb; color: #ffffff; }
    .btn-list-toggle { background: #1e293b; color: #fbbf24; border: 1px solid #334155; display: none; }
    .filters-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
    }
    .filter-control {
      background: #1e293b; border: 1px solid #334155; color: #f8fafc; font-size: 12px;
      border-radius: 8px; padding: 7px 10px; outline: none; width: 100%;
    }
    .filter-search { grid-column: span 2; }
    @media (min-width: 640px) {
      .filters-bar { display: flex; flex-wrap: wrap; align-items: center; }
      .filter-control { width: auto; }
      .filter-search { width: 220px; }
      .brand-title { font-size: 17px; }
    }
    @media (max-width: 767px) {
      .btn-list-toggle { display: inline-flex; }
      .hide-xs { display: none; }
    }
    .main-area {
      display: flex; flex: 1; position: relative; overflow: hidden; width: 100%; height: 100%;
    }
    .sidebar {
      width: 370px; background: #0f172a; border-right: 1px solid #1e293b;
      display: flex; flex-direction: column; flex-shrink: 0; height: 100%; z-index: 20;
    }
    @media (max-width: 767px) {
      .sidebar {
        position: absolute; inset: 0; width: 100%; display: none;
      }
      .sidebar.mobile-open {
        display: flex;
      }
    }
    .sidebar-header {
      padding: 9px 14px; border-bottom: 1px solid #1e293b; display: flex;
      align-items: center; justify-content: space-between; font-size: 12px; color: #94a3b8;
    }
    .legend-dots { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; margin-right: 3px; }
    .places-list { flex: 1; overflow-y: auto; padding-bottom: 40px; }
    .place-item {
      padding: 12px 14px; border-bottom: 1px solid rgba(30,41,59,0.7);
      display: flex; align-items: flex-start; gap: 11px; cursor: pointer; transition: background 0.12s;
    }
    .place-item:hover { background: rgba(30,41,59,0.7); }
    .rank-circle {
      width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 12px; color: #fff; flex-shrink: 0; margin-top: 2px;
    }
    .place-info { flex: 1; min-width: 0; }
    .place-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .place-name { font-size: 14px; font-weight: 600; color: #fff; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score-pill {
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
      background: #1e293b; color: #fbbf24; border: 1px solid #334155; flex-shrink: 0;
    }
    .place-meta { font-size: 12px; color: #94a3b8; margin: 3px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map-wrap { flex: 1; position: relative; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; z-index: 10; }
    .custom-pin {
      display: flex; align-items: center; justify-content: center; border-radius: 9999px;
      font-weight: 800; font-size: 12px; color: #fff; border: 2.5px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    }
    .leaflet-popup-content-wrapper { border-radius: 14px; padding: 2px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
    .leaflet-popup-content { margin: 10px 12px; }
    .popup-card { min-width: 235px; max-width: 275px; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .popup-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px; color: #fff; margin-bottom: 5px; }
    .popup-title { font-weight: 700; font-size: 16px; margin: 0; line-height: 1.25; color: #0f172a; }
    .popup-sub { font-size: 12px; color: #64748b; margin: 2px 0 0 0; }
    .popup-addr { font-size: 12px; color: #475569; margin: 4px 0 0 0; }
    .popup-history { margin-top: 8px; background: #f8fafc; border-radius: 8px; padding: 7px 9px; border: 1px solid #e2e8f0; }
    .popup-history-title { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
    .popup-history-row { font-size: 11px; padding: 3px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #f1f5f9; }
    .popup-history-row:last-child { border-bottom: none; }
    .popup-notes { font-size: 11px; font-style: italic; color: #64748b; margin: 6px 0 0 0; }
    .popup-gmaps-btn {
      margin-top: 9px; display: block; width: 100%; text-align: center; background: #2563eb;
      color: #ffffff !important; text-decoration: none; font-weight: 600; font-size: 12px;
      padding: 9px 12px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <header class="top-header">
      <div class="header-row">
        <div class="brand-box">
          <div class="logo-badge">🍕</div>
          <div style="min-width:0">
            <h1 class="brand-title">Pizza Crawl Map (2015–2026)</h1>
            <p class="brand-sub">52 Pizzerias • 12 Annual Crawls • NYC, Westchester &amp; CT</p>
          </div>
        </div>

        <div class="actions-row">
          <button id="shareBtn" class="btn btn-share" title="Send to a friend">
            <span>📲</span><span>Share</span>
          </button>
          <button id="locateBtn" class="btn btn-locate" title="Show my location">
            <span>📍</span><span class="hide-xs">Near Me</span>
          </button>
          <button id="mobileToggleBtn" class="btn btn-list-toggle">
            <span id="mobileToggleIcon">🏆</span>
            <span id="mobileToggleText">List (52)</span>
          </button>
        </div>
      </div>

      <div class="filters-bar">
        <select id="crawlFilter" class="filter-control">
          <option value="ALL">All 12 Crawls (2015–2026)</option>
          <option value="2026">2026 — Crawl XII (BK/MHTN)</option>
          <option value="2025">2025 — Crawl XI (Westchester)</option>
          <option value="2024">2024 — Crawl X (G.O.A.T.)</option>
          <option value="2023">2023 — Crawl IX (Manhattan)</option>
          <option value="2022">2022 — Crawl VIII (Staten Island)</option>
          <option value="2021">2021 — Crawl VII (Brooklyn)</option>
          <option value="2020">2020 — Crawl VI (New Haven)</option>
          <option value="2019">2019 — Crawl V (Bronx)</option>
          <option value="2018">2018 — Crawl IV (Fire &amp; Slice)</option>
          <option value="2017">2017 — Crawl III (Cheese in Heat)</option>
          <option value="2016">2016 — Crawl II (Brooklyn)</option>
          <option value="2015">2015 — Crawl I (Inaugural)</option>
        </select>

        <select id="regionFilter" class="filter-control">
          <option value="ALL">All Regions (52)</option>
          <option value="Manhattan">Manhattan (18)</option>
          <option value="Brooklyn">Brooklyn (14)</option>
          <option value="Staten Island">Staten Island (5)</option>
          <option value="Bronx">Bronx (5)</option>
          <option value="Westchester">Westchester (5)</option>
          <option value="New Haven, CT">New Haven, CT (5)</option>
        </select>

        <input id="searchInput" type="search" placeholder="Search pizzeria or neighborhood..." class="filter-control filter-search" />
      </div>
    </header>

    <div class="main-area">
      <aside id="sidebarPanel" class="sidebar">
        <div class="sidebar-header">
          <span id="countLabel" style="font-weight:600;color:#cbd5e1">Showing 52 pizzerias</span>
          <div class="legend-dots">
            <span><i class="dot" style="background:#f59e0b"></i>4.0+</span>
            <span><i class="dot" style="background:#10b981"></i>3.6+</span>
            <span><i class="dot" style="background:#3b82f6"></i>3.2+</span>
            <span><i class="dot" style="background:#f43f5e"></i>&lt;3.2</span>
          </div>
        </div>
        <div id="placesList" class="places-list"></div>
      </aside>

      <main class="map-wrap">
        <div id="map"></div>
      </main>
    </div>
  </div>

  <script>
    function ensureLeafletAndBoot() {
      if (typeof window.L !== 'undefined') {
        initPizzaMap();
        return;
      }
      if (!document.getElementById('leaflet-js-loader')) {
        const s = document.createElement('script');
        s.id = 'leaflet-js-loader';
        s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        s.onload = initPizzaMap;
        document.head.appendChild(s);
      } else {
        setTimeout(ensureLeafletAndBoot, 50);
      }
    }

    function initPizzaMap() {
      if (window.__pizzaMapInitialized) return;
      window.__pizzaMapInitialized = true;

      if (!document.querySelector('link[href*="leaflet.css"]')) {
        const lcss = document.createElement('link');
        lcss.rel = 'stylesheet';
        lcss.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(lcss);
      }

      let PLACES = [];
      let mobileListOpen = false;
      let userLocationMarker = null;
      let currentFilteredCount = 52;

      const map = L.map('map', {
        center: [40.735, -73.965],
        zoom: 12,
        zoomControl: false
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0','mt1','mt2','mt3'],
        attribution: '&copy; Google Maps'
      }).addTo(map);

      const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0','mt1','mt2','mt3'],
        attribution: '&copy; Google Maps Satellite'
      });

      L.control.layers({
        "Google Maps": googleStreets,
        "Satellite": googleHybrid
      }, null, { position: 'topright' }).addTo(map);

      const markersLayer = L.layerGroup().addTo(map);

      function getTierColor(score) {
        if (score === null || score === undefined) return '#8b5cf6';
        if (score >= 4.0) return '#f59e0b';
        if (score >= 3.6) return '#10b981';
        if (score >= 3.2) return '#3b82f6';
        return '#f43f5e';
      }

      function toggleMobileView(forceMap) {
        const sidebar = document.getElementById('sidebarPanel');
        const icon = document.getElementById('mobileToggleIcon');
        const text = document.getElementById('mobileToggleText');
        if (forceMap === true) {
          mobileListOpen = false;
        } else {
          mobileListOpen = !mobileListOpen;
        }
        if (mobileListOpen) {
          sidebar.classList.add('mobile-open');
          icon.textContent = '🗺️';
          text.textContent = 'Map View';
        } else {
          sidebar.classList.remove('mobile-open');
          icon.textContent = '🏆';
          text.textContent = `List (${currentFilteredCount})`;
          setTimeout(() => map.invalidateSize(), 60);
        }
      }

      function render() {
        const crawlVal = document.getElementById('crawlFilter').value;
        const regionVal = document.getElementById('regionFilter').value;
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        markersLayer.clearLayers();
        const listEl = document.getElementById('placesList');
        listEl.innerHTML = '';

        const filtered = PLACES.filter(p => {
          if (regionVal !== 'ALL' && p.region !== regionVal) return false;
          if (crawlVal !== 'ALL') {
            const yr = parseInt(crawlVal, 10);
            if (!p.appearances.some(a => a.year === yr)) return false;
          }
          if (query) {
            const hay = (p.name + ' ' + p.neighborhood + ' ' + p.region + ' ' + p.address + ' ' + p.notes).toLowerCase();
            if (!hay.includes(query)) return false;
          }
          return true;
        });

        filtered.sort((a, b) => {
          if (crawlVal !== 'ALL') {
            const yr = parseInt(crawlVal, 10);
            const appA = a.appearances.find(x => x.year === yr);
            const appB = b.appearances.find(x => x.year === yr);
            const rA = appA && appA.rank ? appA.rank : 999;
            const rB = appB && appB.rank ? appB.rank : 999;
            return rA - rB;
          }
          const rA = a.best_rank ? a.best_rank : 999;
          const rB = b.best_rank ? b.best_rank : 999;
          return rA - rB;
        });

        currentFilteredCount = filtered.length;
        document.getElementById('countLabel').textContent = `Showing ${filtered.length} pizzeria${filtered.length === 1 ? '' : 's'}`;
        if (!mobileListOpen) {
          document.getElementById('mobileToggleText').textContent = `List (${filtered.length})`;
        }

        const bounds = [];

        filtered.forEach(p => {
          let activeApp = p.appearances[0];
          if (crawlVal !== 'ALL') {
            const yr = parseInt(crawlVal, 10);
            activeApp = p.appearances.find(x => x.year === yr) || p.appearances[0];
          }
          const color = getTierColor(activeApp.score);

          const icon = L.divIcon({
            className: '',
            html: `<div class="custom-pin" style="background:${color};width:32px;height:32px;">${activeApp.rank ? activeApp.rank : '★'}</div>`,
            iconSize: [32, 32],
            iconAnchor: [16, 16],
            popupAnchor: [0, -16]
          });

          const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' ' + p.address)}`;
          const appsHtml = p.appearances.map(a =>
            `<div class="popup-history-row">
              <span style="color:#334155;font-weight:500">${a.year} — ${a.crawl}</span>
              <span style="font-weight:700;color:#0f172a;white-space:nowrap">${a.score !== null ? a.score.toFixed(3) + ' (#' + a.rank + ')' : 'Inaugural'}</span>
            </div>`
          ).join('');

          const popupHtml = `
            <div class="popup-card">
              <span class="popup-badge" style="background:${color}">
                ${activeApp.rank ? 'Rank #' + activeApp.rank : '2015 Crawl'} • ${activeApp.score !== null ? activeApp.score.toFixed(3) : 'Unscored'}
              </span>
              <h3 class="popup-title">${p.name}</h3>
              <p class="popup-sub">${p.neighborhood} • ${p.region}</p>
              <p class="popup-addr">${p.address}</p>
              <div class="popup-history">
                <div class="popup-history-title">Crawl History</div>
                ${appsHtml}
              </div>
              <p class="popup-notes">${p.notes}</p>
              <a href="${gmapsUrl}" target="_blank" rel="noopener" class="popup-gmaps-btn">
                Open in Google Maps App ↗
              </a>
            </div>
          `;

          const marker = L.marker([p.lat, p.lng], { icon }).bindPopup(popupHtml);
          markersLayer.addLayer(marker);
          bounds.push([p.lat, p.lng]);

          const item = document.createElement('div');
          item.className = 'place-item';
          item.innerHTML = `
            <div class="rank-circle" style="background:${color}">
              ${activeApp.rank ? '#' + activeApp.rank : '★'}
            </div>
            <div class="place-info">
              <div class="place-top">
                <h4 class="place-name">${p.name}</h4>
                <span class="score-pill">${activeApp.score !== null ? activeApp.score.toFixed(3) : '2015'}</span>
              </div>
              <p class="place-meta">${p.neighborhood} (${p.region}) • ${p.address}</p>
            </div>
          `;
          item.addEventListener('click', () => {
            if (window.innerWidth < 768) {
              toggleMobileView(true);
            }
            setTimeout(() => {
              map.setView([p.lat, p.lng], 16, { animate: true });
              marker.openPopup();
            }, 80);
          });
          listEl.appendChild(item);
        });

        if (bounds.length > 0) {
          if (crawlVal === 'ALL' && regionVal === 'ALL' && !query) {
            map.setView([40.735, -73.965], 11);
          } else {
            map.fitBounds(bounds, { padding: [35, 35], maxZoom: 15 });
          }
        }
        setTimeout(() => map.invalidateSize(), 100);
      }

      document.getElementById('mobileToggleBtn').addEventListener('click', () => toggleMobileView());
      document.getElementById('crawlFilter').addEventListener('change', render);
      document.getElementById('regionFilter').addEventListener('change', render);
      document.getElementById('searchInput').addEventListener('input', render);

      document.getElementById('locateBtn').addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser.');
          return;
        }
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          if (userLocationMarker) map.removeLayer(userLocationMarker);
          userLocationMarker = L.circleMarker([latitude, longitude], {
            radius: 9,
            fillColor: '#3b82f6',
            color: '#ffffff',
            weight: 3,
            fillOpacity: 1
          }).addTo(map).bindPopup('<b>You are here</b>').openPopup();
          map.setView([latitude, longitude], 14, { animate: true });
        }, () => {
          alert('Unable to retrieve your location. Make sure location permissions are enabled.');
        });
      });

      document.getElementById('shareBtn').addEventListener('click', async () => {
        const shareUrl = window.location.href;
        const shareData = {
          title: '🍕 Pizza Crawl Map (2015–2026)',
          text: 'Interactive map & rankings of all 52 Pizza Crawl pizzerias (2015–2026):',
          url: shareUrl
        };
        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {}
        }
        try {
          await navigator.clipboard.writeText(shareUrl);
          const btn = document.getElementById('shareBtn');
          const orig = btn.innerHTML;
          btn.innerHTML = '<span>✅</span><span>Copied!</span>';
          setTimeout(() => { btn.innerHTML = orig; }, 2000);
        } catch (e) {
          prompt('Copy this link to send to your friend:', shareUrl);
        }
      });

      fetch('https://raw.githubusercontent.com/TallPantsMan/pizza-crawl-map/main/places.json')
        .then(r => r.json())
        .then(data => {
          PLACES = data;
          render();
        });
    }

    ensureLeafletAndBoot();
  </script>
</body>
</html>
